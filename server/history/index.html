<!doctype html>
<html lang="pt-BR" class="in-root" data-in-theme="dark" data-in-density="focus">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Histórico de revisões</title>
    <link rel="stylesheet" href="/assets/inteiro/tokens.css" />
    <link rel="stylesheet" href="/assets/inteiro/components.css" />
    <style>
      body { margin: 0; }
      header, main { max-width: 960px; margin: 0 auto; padding: 24px; }
      header { display: flex; justify-content: space-between; gap: 16px; align-items: end; }
      h1 { margin: 0 0 8px; }
      .row { display: flex; gap: 8px; align-items: end; }
      .row .in-field { flex: 1; }
      .in-input { width: 100%; box-sizing: border-box; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      ul { list-style: none; padding: 0; margin: 16px 0 0; }
      li { padding: 12px 0; border-bottom: 1px solid var(--in-color-border-subtle); display: flex; justify-content: space-between; gap: 12px; }
      a { color: var(--in-color-identity-primary); }
      .muted { color: var(--in-color-text-secondary); font-size: var(--in-type-caption-size); }
      .error { color: var(--in-color-status-danger); }
      pre { white-space: pre-wrap; background: var(--in-color-background-sunken); color: var(--in-color-text-primary); padding: 12px; border-radius: var(--in-radius-md); }
      img { max-width: 100%; border: 1px solid var(--in-color-border-subtle); border-radius: var(--in-radius-md); }
      .entry { margin: 12px 0; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1 class="in-title">Revisões</h1>
        <p class="in-muted">Histórico gravado pela extensão. O token fica só nesta aba.</p>
      </div>
    </header>
    <main>
      <form id="auth" class="in-card">
        <div class="row">
          <label class="in-field">Token da API
            <input class="in-input" id="token" type="password" autocomplete="off" placeholder="Bearer token" />
          </label>
          <button class="in-button in-button--primary" type="submit">Entrar</button>
        </div>
        <p id="auth-error" class="error"></p>
      </form>
      <section id="list" hidden>
        <div class="card in-card">
          <button id="refresh" class="in-button in-button--ghost" type="button">Atualizar</button>
          <ul id="sessions"></ul>
        </div>
      </section>
      <section id="detail" hidden>
        <p><button id="back" class="in-button in-button--ghost" type="button">Voltar</button></p>
        <div class="card in-card">
          <h2 id="detail-title" class="in-title"></h2>
          <p id="detail-meta" class="muted"></p>
          <p class="actions">
            <button id="download-md" class="in-button in-button--secondary" type="button">Baixar REVIEW.md</button>
            <button id="download-json" class="in-button in-button--ghost" type="button">Baixar review.json</button>
            <button id="finalize" class="in-button in-button--commit" type="button" hidden>Compilar e finalizar</button>
          </p>
          <div id="timeline"></div>
        </div>
      </section>
    </main>
    <script>
      const tokenInput = document.querySelector('#token');
      const authError = document.querySelector('#auth-error');
      const list = document.querySelector('#list');
      const detail = document.querySelector('#detail');
      const sessionsEl = document.querySelector('#sessions');
      let currentId = null;
      let currentExport = null;

      function token() {
        return sessionStorage.getItem('reviewToken') || '';
      }

      async function api(path, options = {}) {
        const headers = new Headers(options.headers || {});
        if (token()) headers.set('Authorization', 'Bearer ' + token());
        const response = await fetch(path, { ...options, headers });
        if (response.status === 401) throw new Error('Token recusado');
        if (!response.ok) throw new Error(await response.text());
        const type = response.headers.get('content-type') || '';
        if (type.includes('application/json')) return response.json();
        return response;
      }

      function showList() {
        detail.hidden = true;
        list.hidden = false;
        document.querySelector('#auth').hidden = true;
      }

      async function loadSessions() {
        const sessions = await api('/sessions?limit=100');
        sessionsEl.innerHTML = '';
        if (!sessions.length) {
          sessionsEl.innerHTML = '<li class="muted">Nenhuma revisão ainda.</li>';
          return;
        }
        for (const session of sessions) {
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.href = '#';
          link.textContent = session.name;
          link.addEventListener('click', (event) => {
            event.preventDefault();
            openSession(session.id);
          });
          const meta = document.createElement('span');
          meta.className = 'muted';
          meta.textContent = session.status + ' · ' + new Date(session.createdAt).toLocaleString('pt-BR');
          item.append(link, meta);
          sessionsEl.append(item);
        }
      }

      function download(filename, content, type) {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = filename;
        anchor.click();
        URL.revokeObjectURL(url);
      }

      async function openSession(id) {
        currentId = id;
        const session = await api('/sessions/' + id);
        currentExport = null;
        document.querySelector('#detail-title').textContent = session.name;
        document.querySelector('#detail-meta').textContent =
          session.status + ' · ativa ' + Math.round((session.activeElapsedMs || 0) / 1000) + 's';
        document.querySelector('#finalize').hidden = session.status !== 'RECOVERABLE';
        const timeline = document.querySelector('#timeline');
        timeline.innerHTML = '';
        list.hidden = true;
        detail.hidden = false;
        if (session.status !== 'COMPLETED' && session.status !== 'RECOVERABLE') {
          timeline.innerHTML = '<p class="muted">A revisão ainda está em andamento.</p>';
          return;
        }
        try {
          currentExport = await api('/sessions/' + id + '/export');
        } catch (error) {
          timeline.innerHTML = '<p class="error">' + error.message + '</p>';
          return;
        }
        const entries = currentExport.reviewJson?.timeline || [];
        if (!entries.length) timeline.innerHTML = '<p class="muted">Sem timeline compilada.</p>';
        for (const entry of entries) {
          const block = document.createElement('div');
          block.className = 'entry';
          const title = document.createElement('strong');
          title.textContent = (entry.offset || '') + ' ' + (entry.label || entry.action || entry.type);
          block.append(title);
          if (entry.speech?.text) {
            const speech = document.createElement('p');
            speech.textContent = entry.speech.text;
            block.append(speech);
          }
          if (entry.candidateElement?.accessibleName) {
            const element = document.createElement('p');
            element.className = 'muted';
            element.textContent = 'Elemento: ' + entry.candidateElement.accessibleName;
            block.append(element);
          }
          timeline.append(block);
        }
        const shots = await api('/sessions/' + id + '/evidence');
        for (const shot of shots) {
          const image = document.createElement('img');
          image.alt = 'Screenshot da revisão';
          const response = await api('/sessions/' + id + '/evidence/' + encodeURIComponent(shot.id));
          if (response instanceof Response) {
            image.src = URL.createObjectURL(await response.blob());
            timeline.append(image);
          }
        }
      }

      document.querySelector('#auth').addEventListener('submit', async (event) => {
        event.preventDefault();
        sessionStorage.setItem('reviewToken', tokenInput.value.trim());
        try {
          await loadSessions();
          authError.textContent = '';
          showList();
        } catch (error) {
          authError.textContent = error.message;
        }
      });
      document.querySelector('#refresh').addEventListener('click', () => loadSessions().catch((error) => {
        authError.textContent = error.message;
      }));
      document.querySelector('#back').addEventListener('click', () => {
        detail.hidden = true;
        showList();
        loadSessions();
      });
      document.querySelector('#download-md').addEventListener('click', () => {
        if (currentExport?.reviewMd) download('REVIEW.md', currentExport.reviewMd, 'text/markdown');
      });
      document.querySelector('#download-json').addEventListener('click', () => {
        if (currentExport?.reviewJson) download('review.json', JSON.stringify(currentExport.reviewJson, null, 2), 'application/json');
      });
      document.querySelector('#finalize').addEventListener('click', async () => {
        if (!currentId) return;
        await api('/sessions/' + currentId + '/finalize', { method: 'POST' });
        await openSession(currentId);
      });

      if (token()) tokenInput.value = token();
      loadSessions().then(showList).catch(() => {});
    </script>
  </body>
</html>
