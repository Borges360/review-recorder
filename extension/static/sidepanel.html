<!doctype html>
<html lang="pt-BR" class="in-root" data-in-theme="dark" data-in-density="focus">
  <head>
    <meta charset="utf-8" />
    <title>Review Recorder</title>
    <link rel="stylesheet" href="vendor/inteiro-tokens.css" />
    <link rel="stylesheet" href="vendor/inteiro-components.css" />
    <link rel="stylesheet" href="vendor/recursive/fonts.css" />
    <style>
      body { max-inline-size: 320px; margin: 16px; }
      .in-field { margin-bottom: 12px; }
      .in-input { width: 100%; box-sizing: border-box; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    </style>
  </head>
  <body>
    <h1 class="in-title">Revisão</h1>
    <label class="in-field">Nome
      <input class="in-input" id="name" value="Revisão" />
    </label>
    <div class="actions">
      <button id="start" class="in-button in-button--primary" type="button">Gravar</button>
      <button id="pause" class="in-button in-button--secondary" type="button">Pausar</button>
      <button id="resume" class="in-button in-button--secondary" type="button">Retomar</button>
      <button id="shot" class="in-button in-button--secondary" type="button">Print</button>
      <button id="stop" class="in-button in-button--danger" type="button">Parar</button>
    </div>
    <p><button id="history" class="in-button in-button--ghost" type="button">Abrir histórico</button></p>
    <p><button id="options" class="in-button in-button--ghost" type="button">Configurar API</button></p>
    <p id="status" class="in-muted">Pronta</p>
    <script src="sidepanel.js"></script>
  </body>
</html>
