<!doctype html>
<html lang="pt-BR" class="in-root" data-in-theme="dark" data-in-density="focus">
  <head>
    <meta charset="utf-8" />
    <title>Configurar API</title>
    <link rel="stylesheet" href="vendor/inteiro-tokens.css" />
    <link rel="stylesheet" href="vendor/inteiro-components.css" />
    <link rel="stylesheet" href="vendor/recursive/fonts.css" />
    <style>
      body { max-inline-size: 520px; margin: 32px auto; padding-inline: 16px; }
      .in-field { margin-bottom: 12px; }
      .in-input { width: 100%; box-sizing: border-box; }
      .actions { display: flex; gap: 8px; }
    </style>
  </head>
  <body>
    <h1 class="in-title">API do homelab</h1>
    <label class="in-field">URL
      <input class="in-input" id="base" placeholder="https://review.luizfelipeborges.dev" />
    </label>
    <label class="in-field">Token
      <input class="in-input" id="token" type="password" />
    </label>
    <div class="actions">
      <button id="save" class="in-button in-button--primary" type="button">Salvar</button>
      <button id="test" class="in-button in-button--secondary" type="button">Testar</button>
    </div>
    <p id="result" class="in-muted"></p>
    <script src="options.js"></script>
  </body>
</html>
